name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Scan tracked files for private data
        shell: pwsh
        run: ./scripts/Test-Privacy.ps1

      - name: Restore
        shell: pwsh
        run: dotnet restore ./ModelPeek.csproj

      - name: Build
        shell: pwsh
        run: dotnet build ./ModelPeek.csproj -c Release --no-restore -warnaserror

      - name: Publish portable EXE
        shell: pwsh
        run: dotnet publish ./ModelPeek.csproj -c Release -r win-x64 --self-contained true --no-restore -o ./artifacts/publish

      - name: Verify metadata, privacy, and STL behavior
        shell: pwsh
        run: ./scripts/Test-Release.ps1 -ExecutablePath ./artifacts/publish/ModelPeek.exe

      - name: Upload tested EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ModelPeek-win-x64
          path: artifacts/publish/ModelPeek.exe
          if-no-files-found: error
